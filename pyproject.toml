[project]
name = "vin-whatsapp-sales-automation"
version = "1.0.0"
description = "Official WhatsApp Cloud API sales replies for VIN Corporate Services Sdn Bhd"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
